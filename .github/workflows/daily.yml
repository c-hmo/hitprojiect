name: Daily GitHub Trending & AI Summary

on:
  schedule:
    # 每天北京时间早上 8 点运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动在网页端点击运行

permissions:
  contents: write # 必须：允许将修改后的 history.json 推送回仓库

jobs:
  build_and_send:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-generativeai

    - name: Run Main Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASS: ${{ secrets.SENDER_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python main.py

    - name: Commit and Push History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history.json
        git commit -m "Update trending history and AI cache [skip ci]" || echo "No changes to commit"
        git push
