name: Daily GitHub Trending & AI Summary

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_send:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'  # 升级到最新的稳定版本 3.12

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # 替换为了全新的 google-genai 包
        pip install requests beautifulsoup4 google-genai

    - name: Run Main Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASS: ${{ secrets.SENDER_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python main.py

    - name: Commit and Push History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history.json
        git commit -m "Update trending history and AI cache [skip ci]" || echo "No changes to commit"
        git push
